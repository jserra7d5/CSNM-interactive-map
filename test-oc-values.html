<!DOCTYPE html>
<html>
<head>
    <title>Test OC Values</title>
    <script src="https://unpkg.com/geotiff@2.1.3/dist-browser/geotiff.js"></script>
</head>
<body>
    <h1>OC TIFF Value Analysis</h1>
    <div id="output"></div>

    <script>
    async function analyzeOC() {
        const output = document.getElementById('output');

        try {
            const response = await fetch('data/rasters/oc/CSNM_OC_0_5cm.tif');
            const arrayBuffer = await response.arrayBuffer();

            const tiff = await GeoTIFF.fromArrayBuffer(arrayBuffer);
            const image = await tiff.getImage();
            const rasters = await image.readRasters();
            const data = rasters[0];

            // Get image info
            const width = image.getWidth();
            const height = image.getHeight();

            // Filter valid data
            const validData = [];
            for (let i = 0; i < data.length; i++) {
                if (data[i] > 0 && data[i] !== -9999 && data[i] < 10000) {
                    validData.push(data[i]);
                }
            }

            const min = Math.min(...validData);
            const max = Math.max(...validData);
            const mean = validData.reduce((a, b) => a + b, 0) / validData.length;

            // Check distribution
            const ranges = [
                [0, 50],
                [50, 100],
                [100, 200],
                [200, 500],
                [500, 1000],
                [1000, 2000]
            ];

            let html = `
                <p>Image: ${width}x${height}</p>
                <p>Total pixels: ${data.length}</p>
                <p>Valid pixels: ${validData.length}</p>
                <p><strong>Min: ${min.toFixed(2)}</strong></p>
                <p><strong>Max: ${max.toFixed(2)}</strong></p>
                <p><strong>Mean: ${mean.toFixed(2)}</strong></p>
                <h3>Distribution:</h3>
            `;

            for (const [rangeMin, rangeMax] of ranges) {
                const count = validData.filter(v => v >= rangeMin && v < rangeMax).length;
                if (count > 0) {
                    html += `<p>${rangeMin}-${rangeMax}: ${count} pixels</p>`;
                }
            }

            // Sample values
            html += '<h3>Sample values:</h3>';
            html += '<p>' + validData.slice(0, 20).map(v => v.toFixed(1)).join(', ') + '</p>';

            output.innerHTML = html;

        } catch (error) {
            output.innerHTML = `<p>Error: ${error.message}</p>`;
        }
    }

    analyzeOC();
    </script>
</body>
</html>
