<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Map Debug</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }
        .test-map {
            width: 400px;
            height: 300px;
            border: 2px solid #333;
            margin: 10px;
            display: inline-block;
        }
        .map-label {
            font-weight: bold;
            margin-top: 10px;
        }
        #console {
            background: black;
            color: lime;
            font-family: monospace;
            padding: 10px;
            height: 200px;
            overflow-y: scroll;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Story Map Debug</h1>
    
    <div class="map-label">Test Soil Orders Map</div>
    <div id="test-soil-orders" class="test-map"></div>
    
    <div class="map-label">Test Elevation Map</div>
    <div id="test-elevation" class="test-map"></div>
    
    <div class="map-label">Test Precipitation Map</div>
    <div id="test-precipitation" class="test-map"></div>
    
    <div id="console">
        <div>Console Output:</div>
    </div>
    
    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/geotiff@2.1.3/dist-browser/geotiff.js"></script>
    <script src="js/config.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/raster-utils.js"></script>
    <script src="js/map-utils.js"></script>
    <script src="js/story-interactive-maps.js"></script>
    
    <script>
        const consoleDiv = document.getElementById('console');
        
        // Override console.log to show in page
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
            consoleDiv.innerHTML += `<div style="color: lime">[LOG] ${msg}</div>`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
            consoleDiv.innerHTML += `<div style="color: red">[ERROR] ${msg}</div>`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
            consoleDiv.innerHTML += `<div style="color: yellow">[WARN] ${msg}</div>`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        };
        
        async function testMaps() {
            console.log('Starting map tests...');
            
            try {
                // Initialize the story interactive maps
                const maps = new StoryInteractiveMaps();
                await maps.init();
                console.log('StoryInteractiveMaps initialized');
                
                // Test soil orders map
                console.log('Creating soil orders map...');
                maps.createMap('test-soil-orders', 'soilOrders', {
                    zoom: 10,
                    title: 'Soil Orders Test'
                });
                
                // Test elevation raster map
                console.log('Creating elevation map...');
                await maps.createRasterMap('test-elevation', 'elevation', {
                    zoom: 10,
                    title: 'Elevation Test'
                });
                
                // Test precipitation raster map
                console.log('Creating precipitation map...');
                await maps.createRasterMap('test-precipitation', 'precipitation', {
                    zoom: 10,
                    title: 'Precipitation Test'
                });
                
                console.log('All maps created successfully!');
                
            } catch (error) {
                console.error('Error during testing:', error);
            }
        }
        
        // Run tests when page loads
        window.addEventListener('DOMContentLoaded', testMaps);
    </script>
</body>
</html>
